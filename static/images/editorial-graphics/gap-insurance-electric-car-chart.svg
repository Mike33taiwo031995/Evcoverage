<svg xmlns="http://www.w3.org/2000/svg" width="390" height="535" viewBox="0 0 390 535" role="img" aria-labelledby="title desc"><title id="title">A loan shortfall is not automatically a GAP benefit</title><desc id="desc">The article&#x27;s hypothetical $34,000 loan balance consists of a $29,000 net auto payment and a $5,000 remaining difference. The GAP contract, not this chart, determines any eligible benefit.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="20" y="28" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">A loan shortfall is not</text><text x="20" y="53" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">automatically a GAP benefit</text><text x="20" y="85" fill="#26435a" font-size="13" font-weight="400" text-anchor="start">Article example: $34,000 outstanding balance</text><path d="M 195 235 L 195.0000 136.0000 A 99 99 0 1 1 115.9963 175.3392 Z" fill="#61A9BD" stroke="white" stroke-width="2"><title>Net auto payment: $29,000 (85.3%)</title></path><path d="M 195 235 L 115.9963 175.3392 A 99 99 0 0 1 195.0000 136.0000 Z" fill="#CED14E" stroke="white" stroke-width="2"><title>Remaining difference: $5,000 (14.7%)</title></path><rect x="22" y="353" width="13" height="13" rx="2" fill="#61A9BD"/><text x="44" y="365" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Net auto payment: $29,000 (85%)</text><rect x="22" y="383" width="13" height="13" rx="2" fill="#CED14E"/><text x="44" y="395" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Remaining difference: $5,000 (15%)</text><line x1="20" y1="452" x2="370" y2="452" stroke="#d8e3ec"/><text x="20" y="474" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">$30,000 value minus $1,000 deductible = $29,000 net</text><text x="20" y="490" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">payment.</text></g></svg>