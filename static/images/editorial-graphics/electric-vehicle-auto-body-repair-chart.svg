<svg xmlns="http://www.w3.org/2000/svg" width="390" height="595" viewBox="0 0 390 595" role="img" aria-labelledby="title desc"><title id="title">An estimate contains more than parts</title><desc id="desc">Hypothetical $4,700 body repair: parts $2,000, labor $1,500, paint and materials $900 and documented checks $300. These are illustrative amounts, not a quote or required repair procedure.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="20" y="28" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">An estimate contains more than</text><text x="20" y="53" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">parts</text><text x="20" y="85" fill="#26435a" font-size="13" font-weight="400" text-anchor="start">Hypothetical $4,700 body-repair estimate</text><path d="M 195 235 L 195.0000 136.0000 A 99 99 0 0 1 239.6500 323.3594 Z" fill="#61A9BD" stroke="white" stroke-width="2"><title>Parts: $2,000 (42.6%)</title></path><path d="M 195 235 L 239.6500 323.3594 A 99 99 0 0 1 96.0553 238.3081 Z" fill="#CED14E" stroke="white" stroke-width="2"><title>Labor: $1,500 (31.9%)</title></path><path d="M 195 235 L 96.0553 238.3081 A 99 99 0 0 1 156.3515 143.8557 Z" fill="#44986D" stroke="white" stroke-width="2"><title>Paint/materials: $900 (19.1%)</title></path><path d="M 195 235 L 156.3515 143.8557 A 99 99 0 0 1 195.0000 136.0000 Z" fill="#DD83C9" stroke="white" stroke-width="2"><title>Documented checks: $300 (6.4%)</title></path><rect x="22" y="353" width="13" height="13" rx="2" fill="#61A9BD"/><text x="44" y="365" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Parts: $2,000 (43%)</text><rect x="22" y="383" width="13" height="13" rx="2" fill="#CED14E"/><text x="44" y="395" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Labor: $1,500 (32%)</text><rect x="22" y="413" width="13" height="13" rx="2" fill="#44986D"/><text x="44" y="425" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Paint/materials: $900 (19%)</text><rect x="22" y="443" width="13" height="13" rx="2" fill="#DD83C9"/><text x="44" y="455" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Documented checks: $300 (6%)</text><line x1="20" y1="512" x2="370" y2="512" stroke="#d8e3ec"/><text x="20" y="534" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">Illustration: $2,000 + $1,500 + $900 + $300; not a</text><text x="20" y="550" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">quote.</text></g></svg>