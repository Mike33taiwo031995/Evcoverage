<svg xmlns="http://www.w3.org/2000/svg" width="390" height="510" viewBox="0 0 390 510" role="img" aria-labelledby="title desc"><title id="title">Small annual savings accumulate slowly</title><desc id="desc">At the article&#x27;s hypothetical $180 annual premium saving, cumulative savings are $180 over 1 year, $540 over 3, $900 over 5 and $1,080 over 6, assuming unchanged premiums and no claims. The example increases the deductible by $1,000.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="20" y="28" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">Small annual savings accumulate</text><text x="20" y="53" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">slowly</text><text x="20" y="85" fill="#26435a" font-size="13" font-weight="400" text-anchor="start">Article example: $180 saved per claim-free year</text><line x1="53" y1="350.0" x2="370" y2="350.0" stroke="#e2e9ee"/><text x="46" y="354.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$0</text><line x1="53" y1="308.0" x2="370" y2="308.0" stroke="#e2e9ee"/><text x="46" y="312.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$300</text><line x1="53" y1="266.0" x2="370" y2="266.0" stroke="#e2e9ee"/><text x="46" y="270.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$600</text><line x1="53" y1="224.0" x2="370" y2="224.0" stroke="#e2e9ee"/><text x="46" y="228.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$900</text><line x1="53" y1="182.0" x2="370" y2="182.0" stroke="#e2e9ee"/><text x="46" y="186.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$1,200</text><line x1="53" y1="140.0" x2="370" y2="140.0" stroke="#e2e9ee"/><text x="46" y="144.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$1,500</text><rect x="67.625" y="324.8" width="50" height="25.2" rx="3" fill="#61A9BD"><title>1 year: $180</title></rect><text x="92.625" y="315.8" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$180</text><text x="92.625" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">1 year</text><rect x="146.875" y="274.4" width="50" height="75.6" rx="3" fill="#61A9BD"><title>3 years: $540</title></rect><text x="171.875" y="265.4" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$540</text><text x="171.875" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">3 years</text><rect x="226.125" y="224.0" width="50" height="126.0" rx="3" fill="#61A9BD"><title>5 years: $900</title></rect><text x="251.125" y="215.0" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$900</text><text x="251.125" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">5 years</text><rect x="305.375" y="198.8" width="50" height="151.2" rx="3" fill="#61A9BD"><title>6 years: $1,080</title></rect><text x="330.375" y="189.8" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$1,080</text><text x="330.375" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">6 years</text><line x1="20" y1="427" x2="370" y2="427" stroke="#d8e3ec"/><text x="20" y="449" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">1, 3, 5 and 6 years: $180, $540, $900 and $1,080.</text><text x="20" y="465" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">No forecast.</text></g></svg>