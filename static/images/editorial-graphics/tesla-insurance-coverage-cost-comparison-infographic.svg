<svg xmlns="http://www.w3.org/2000/svg" width="390" height="775" viewBox="0 0 390 775" role="img" aria-labelledby="title desc"><title id="title">Compare the policy, not only the Tesla name</title><desc id="desc">Confirm availability: Check which state-specific product and terms are actually offered. Read driving-data terms: Safety Score is not used for California premiums, per Tesla&#x27;s cited guidance. Match the cover: Compare limits, deductibles, repair terms and total-loss settlement basis. Switch without a gap: Confirm new cover is in force before canceling an existing policy.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="390" height="140" fill="#183b58"/><text x="24" y="28" fill="#b8d9ea" font-size="11" font-weight="700" letter-spacing="1">YOUR EV OWNER CHECKLIST</text><text x="24" y="60" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">Compare the policy, not only</text><text x="24" y="86" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">the Tesla name</text><rect x="19" y="158" width="352" height="128" rx="14" fill="#f0f5fa" stroke="#d7e3ec"/><circle cx="45" cy="185" r="15" fill="#24577b"/><text x="45" y="190" text-anchor="middle" font-size="14" fill="white" font-weight="700">1</text><text x="70" y="189" fill="#183b58" font-size="14" font-weight="700" text-anchor="start">Confirm availability</text><text x="35" y="218" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Check which state-specific product and terms</text><text x="35" y="235" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">are actually offered.</text><path d="M195 289 v8 m-4-4 4 4 4-4" fill="none" stroke="#61A9BD" stroke-width="2"/><rect x="19" y="300" width="352" height="128" rx="14" fill="#f0f5fa" stroke="#d7e3ec"/><circle cx="45" cy="327" r="15" fill="#24577b"/><text x="45" y="332" text-anchor="middle" font-size="14" fill="white" font-weight="700">2</text><text x="70" y="331" fill="#183b58" font-size="14" font-weight="700" text-anchor="start">Read driving-data terms</text><text x="35" y="360" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Safety Score is not used for California</text><text x="35" y="377" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">premiums, per Tesla&#x27;s cited guidance.</text><path d="M195 431 v8 m-4-4 4 4 4-4" fill="none" stroke="#61A9BD" stroke-width="2"/><rect x="19" y="442" width="352" height="128" rx="14" fill="#f0f5fa" stroke="#d7e3ec"/><circle cx="45" cy="469" r="15" fill="#24577b"/><text x="45" y="474" text-anchor="middle" font-size="14" fill="white" font-weight="700">3</text><text x="70" y="473" fill="#183b58" font-size="14" font-weight="700" text-anchor="start">Match the cover</text><text x="35" y="502" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Compare limits, deductibles, repair terms and</text><text x="35" y="519" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">total-loss settlement basis.</text><path d="M195 573 v8 m-4-4 4 4 4-4" fill="none" stroke="#61A9BD" stroke-width="2"/><rect x="19" y="584" width="352" height="128" rx="14" fill="#f0f5fa" stroke="#d7e3ec"/><circle cx="45" cy="611" r="15" fill="#24577b"/><text x="45" y="616" text-anchor="middle" font-size="14" fill="white" font-weight="700">4</text><text x="70" y="615" fill="#183b58" font-size="14" font-weight="700" text-anchor="start">Switch without a gap</text><text x="35" y="644" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Confirm new cover is in force before canceling</text><text x="35" y="661" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">an existing policy.</text><text x="24" y="752" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">Read the guide for policy and safety details.</text></g></svg>