<svg xmlns="http://www.w3.org/2000/svg" width="390" height="510" viewBox="0 0 390 510" role="img" aria-labelledby="title desc"><title id="title">The damage total is not a payment promise</title><desc id="desc">For an entirely hypothetical $10,000 loss, assuming full coverage subject only to a $1,000 deductible gives $9,000; assuming the entire loss is validly excluded gives $0. This does not classify any real event or policy.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="20" y="28" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">The damage total is not a</text><text x="20" y="53" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">payment promise</text><text x="20" y="85" fill="#26435a" font-size="13" font-weight="400" text-anchor="start">Two hypothetical outcomes for a $10,000 loss</text><text x="20" y="162" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Assumed covered</text><rect x="157" y="143" width="103.800" height="28" rx="3" fill="#61A9BD"><title>Assumed covered: $9,000</title></rect><text x="265.8" y="162" fill="#152f45" font-size="12" font-weight="700" text-anchor="start">$9,000</text><text x="20" y="254" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Assumed excluded</text><rect x="157" y="235" width="0.000" height="28" rx="3" fill="#61A9BD"><title>Assumed excluded: $0</title></rect><text x="162.0" y="254" fill="#152f45" font-size="12" font-weight="700" text-anchor="start">$0</text><line x1="157" y1="130" x2="157" y2="340" stroke="#8a9dab"/><text x="157" y="365" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">$0 baseline</text><line x1="20" y1="427" x2="370" y2="427" stroke="#d8e3ec"/><text x="20" y="449" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">Assumptions: covered less $1,000 deductible, or</text><text x="20" y="465" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">fully excluded.</text></g></svg>