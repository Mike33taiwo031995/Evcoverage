<svg xmlns="http://www.w3.org/2000/svg" width="390" height="775" viewBox="0 0 390 775" role="img" aria-labelledby="title desc"><title id="title">When an exclusion is raised: ask for specifics</title><desc id="desc">Get the wording: Obtain the policy, schedule and applicable endorsements. Separate cause and damage: A fire or explosion label alone does not determine the legal cause. Request the reasoning: Ask which facts and exact clause support the insurer&#x27;s written decision. Use local review routes: Follow the complaint process and seek qualified advice where appropriate.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="390" height="140" fill="#183b58"/><text x="24" y="28" fill="#b8d9ea" font-size="11" font-weight="700" letter-spacing="1">YOUR EV OWNER CHECKLIST</text><text x="24" y="60" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">When an exclusion is raised:</text><text x="24" y="86" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">ask for specifics</text><rect x="19" y="158" width="352" height="128" rx="14" fill="#f0f5fa" stroke="#d7e3ec"/><circle cx="45" cy="185" r="15" fill="#24577b"/><text x="45" y="190" text-anchor="middle" font-size="14" fill="white" font-weight="700">1</text><text x="70" y="189" fill="#183b58" font-size="14" font-weight="700" text-anchor="start">Get the wording</text><text x="35" y="218" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Obtain the policy, schedule and applicable</text><text x="35" y="235" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">endorsements.</text><path d="M195 289 v8 m-4-4 4 4 4-4" fill="none" stroke="#61A9BD" stroke-width="2"/><rect x="19" y="300" width="352" height="128" rx="14" fill="#f0f5fa" stroke="#d7e3ec"/><circle cx="45" cy="327" r="15" fill="#24577b"/><text x="45" y="332" text-anchor="middle" font-size="14" fill="white" font-weight="700">2</text><text x="70" y="331" fill="#183b58" font-size="14" font-weight="700" text-anchor="start">Separate cause and damage</text><text x="35" y="360" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">A fire or explosion label alone does not</text><text x="35" y="377" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">determine the legal cause.</text><path d="M195 431 v8 m-4-4 4 4 4-4" fill="none" stroke="#61A9BD" stroke-width="2"/><rect x="19" y="442" width="352" height="128" rx="14" fill="#f0f5fa" stroke="#d7e3ec"/><circle cx="45" cy="469" r="15" fill="#24577b"/><text x="45" y="474" text-anchor="middle" font-size="14" fill="white" font-weight="700">3</text><text x="70" y="473" fill="#183b58" font-size="14" font-weight="700" text-anchor="start">Request the reasoning</text><text x="35" y="502" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Ask which facts and exact clause support the</text><text x="35" y="519" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">insurer&#x27;s written decision.</text><path d="M195 573 v8 m-4-4 4 4 4-4" fill="none" stroke="#61A9BD" stroke-width="2"/><rect x="19" y="584" width="352" height="128" rx="14" fill="#f0f5fa" stroke="#d7e3ec"/><circle cx="45" cy="611" r="15" fill="#24577b"/><text x="45" y="616" text-anchor="middle" font-size="14" fill="white" font-weight="700">4</text><text x="70" y="615" fill="#183b58" font-size="14" font-weight="700" text-anchor="start">Use local review routes</text><text x="35" y="644" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Follow the complaint process and seek qualified</text><text x="35" y="661" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">advice where appropriate.</text><text x="24" y="752" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">Read the guide for policy and safety details.</text></g></svg>