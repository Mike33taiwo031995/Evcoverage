<svg xmlns="http://www.w3.org/2000/svg" width="390" height="535" viewBox="0 0 390 535" role="img" aria-labelledby="title desc"><title id="title">A deductible is part of your repair bill</title><desc id="desc">Hypothetical covered repair of $10,000: insurer share $9,000 and owner deductible $1,000, assuming no other adjustments.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="20" y="28" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">A deductible is part of your</text><text x="20" y="53" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">repair bill</text><text x="20" y="85" fill="#26435a" font-size="13" font-weight="400" text-anchor="start">Hypothetical covered $10,000 repair</text><path d="M 195 235 L 195.0000 136.0000 A 99 99 0 1 1 136.8093 154.9073 Z" fill="#61A9BD" stroke="white" stroke-width="2"><title>Insurer share: $9,000 (90.0%)</title></path><path d="M 195 235 L 136.8093 154.9073 A 99 99 0 0 1 195.0000 136.0000 Z" fill="#CED14E" stroke="white" stroke-width="2"><title>Owner deductible: $1,000 (10.0%)</title></path><rect x="22" y="353" width="13" height="13" rx="2" fill="#61A9BD"/><text x="44" y="365" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Insurer share: $9,000 (90%)</text><rect x="22" y="383" width="13" height="13" rx="2" fill="#CED14E"/><text x="44" y="395" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Owner deductible: $1,000 (10%)</text><line x1="20" y1="452" x2="370" y2="452" stroke="#d8e3ec"/><text x="20" y="474" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">Illustration only: $1,000 deductible; no other</text><text x="20" y="490" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">adjustments.</text></g></svg>