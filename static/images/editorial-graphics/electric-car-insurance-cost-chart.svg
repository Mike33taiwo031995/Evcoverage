<svg xmlns="http://www.w3.org/2000/svg" width="390" height="510" viewBox="0 0 390 510" role="img" aria-labelledby="title desc"><title id="title">A lower premium can cost more in a claim year</title><desc id="desc">In the article&#x27;s hypothetical covered $6,000 collision example, annual premium plus deductible is $3,300 for Quote A and $2,540 for Quote B, before other adjustments, costs or benefits.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="20" y="28" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">A lower premium can cost more</text><text x="20" y="53" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">in a claim year</text><text x="20" y="85" fill="#26435a" font-size="13" font-weight="400" text-anchor="start">Article example: premium plus collision</text><text x="20" y="103" fill="#26435a" font-size="13" font-weight="400" text-anchor="start">deductible</text><line x1="53" y1="350.0" x2="370" y2="350.0" stroke="#e2e9ee"/><text x="46" y="354.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$0</text><line x1="53" y1="308.0" x2="370" y2="308.0" stroke="#e2e9ee"/><text x="46" y="312.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$900</text><line x1="53" y1="266.0" x2="370" y2="266.0" stroke="#e2e9ee"/><text x="46" y="270.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$1,800</text><line x1="53" y1="224.0" x2="370" y2="224.0" stroke="#e2e9ee"/><text x="46" y="228.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$2,700</text><line x1="53" y1="182.0" x2="370" y2="182.0" stroke="#e2e9ee"/><text x="46" y="186.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$3,600</text><line x1="53" y1="140.0" x2="370" y2="140.0" stroke="#e2e9ee"/><text x="46" y="144.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$4,500</text><rect x="107.25" y="196.0" width="50" height="154.0" rx="3" fill="#61A9BD"><title>Quote A: $3,300</title></rect><text x="132.25" y="187.0" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$3,300</text><text x="132.25" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">Quote A</text><rect x="265.75" y="231.46666666666667" width="50" height="118.53333333333333" rx="3" fill="#61A9BD"><title>Quote B: $2,540</title></rect><text x="290.75" y="222.46666666666667" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$2,540</text><text x="290.75" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">Quote B</text><line x1="20" y1="427" x2="370" y2="427" stroke="#d8e3ec"/><text x="20" y="449" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">Covered $6,000 repair; A: $1,800+$1,500; B:</text><text x="20" y="465" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">$2,040+$500.</text></g></svg>