<svg xmlns="http://www.w3.org/2000/svg" width="390" height="510" viewBox="0 0 390 510" role="img" aria-labelledby="title desc"><title id="title">More rental days mean a larger bill</title><desc id="desc">At an assumed $45 daily rental rate, 7 days costs $315, 14 days $630 and 21 days $945. These are not policy benefits.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="20" y="28" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">More rental days mean a larger</text><text x="20" y="53" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">bill</text><text x="20" y="85" fill="#26435a" font-size="13" font-weight="400" text-anchor="start">Hypothetical rental cost at $45 per day</text><line x1="53" y1="350.0" x2="370" y2="350.0" stroke="#e2e9ee"/><text x="46" y="354.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$0</text><line x1="53" y1="308.0" x2="370" y2="308.0" stroke="#e2e9ee"/><text x="46" y="312.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$300</text><line x1="53" y1="266.0" x2="370" y2="266.0" stroke="#e2e9ee"/><text x="46" y="270.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$600</text><line x1="53" y1="224.0" x2="370" y2="224.0" stroke="#e2e9ee"/><text x="46" y="228.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$900</text><line x1="53" y1="182.0" x2="370" y2="182.0" stroke="#e2e9ee"/><text x="46" y="186.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$1,200</text><line x1="53" y1="140.0" x2="370" y2="140.0" stroke="#e2e9ee"/><text x="46" y="144.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$1,500</text><rect x="80.83333333333334" y="305.9" width="50" height="44.1" rx="3" fill="#61A9BD"><title>7 days: $315</title></rect><text x="105.83333333333334" y="296.9" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$315</text><text x="105.83333333333334" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">7 days</text><rect x="186.5" y="261.8" width="50" height="88.2" rx="3" fill="#61A9BD"><title>14 days: $630</title></rect><text x="211.5" y="252.8" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$630</text><text x="211.5" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">14 days</text><rect x="292.1666666666667" y="217.7" width="50" height="132.3" rx="3" fill="#61A9BD"><title>21 days: $945</title></rect><text x="317.1666666666667" y="208.7" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$945</text><text x="317.1666666666667" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">21 days</text><line x1="20" y1="427" x2="370" y2="427" stroke="#d8e3ec"/><text x="20" y="449" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">7 days: $315; 14 days: $630; 21 days: $945. Not a</text><text x="20" y="465" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">benefit limit.</text></g></svg>