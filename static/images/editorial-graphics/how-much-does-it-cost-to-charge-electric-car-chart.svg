<svg xmlns="http://www.w3.org/2000/svg" width="390" height="510" viewBox="0 0 390 510" role="img" aria-labelledby="title desc"><title id="title">Your electricity rate changes the same trip</title><desc id="desc">At the article&#x27;s assumed 30 kWh per 100 miles, energy costs are $4.50 at $0.15 per kWh, $7.50 at $0.25 and $15 at $0.50, excluding other fees.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="20" y="28" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">Your electricity rate changes</text><text x="20" y="53" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">the same trip</text><text x="20" y="85" fill="#26435a" font-size="13" font-weight="400" text-anchor="start">Energy cost per 100 miles at 30 kWh/100 miles</text><line x1="53" y1="350.0" x2="370" y2="350.0" stroke="#e2e9ee"/><text x="46" y="354.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$0</text><line x1="53" y1="308.0" x2="370" y2="308.0" stroke="#e2e9ee"/><text x="46" y="312.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$4</text><line x1="53" y1="266.0" x2="370" y2="266.0" stroke="#e2e9ee"/><text x="46" y="270.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$8</text><line x1="53" y1="224.0" x2="370" y2="224.0" stroke="#e2e9ee"/><text x="46" y="228.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$12</text><line x1="53" y1="182.0" x2="370" y2="182.0" stroke="#e2e9ee"/><text x="46" y="186.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$16</text><line x1="53" y1="140.0" x2="370" y2="140.0" stroke="#e2e9ee"/><text x="46" y="144.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$20</text><rect x="80.83333333333334" y="302.75" width="50" height="47.25" rx="3" fill="#61A9BD"><title>$0.15/kWh: $4.50</title></rect><text x="105.83333333333334" y="293.75" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$4.50</text><text x="105.83333333333334" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">$0.15/kWh</text><rect x="186.5" y="271.25" width="50" height="78.75" rx="3" fill="#61A9BD"><title>$0.25/kWh: $7.50</title></rect><text x="211.5" y="262.25" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$7.50</text><text x="211.5" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">$0.25/kWh</text><rect x="292.1666666666667" y="192.5" width="50" height="157.5" rx="3" fill="#61A9BD"><title>$0.50/kWh: $15</title></rect><text x="317.1666666666667" y="183.5" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$15</text><text x="317.1666666666667" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">$0.50/kWh</text><line x1="20" y1="427" x2="370" y2="427" stroke="#d8e3ec"/><text x="20" y="449" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">Hypothetical rates; excludes session fees and other</text><text x="20" y="465" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">charges.</text></g></svg>