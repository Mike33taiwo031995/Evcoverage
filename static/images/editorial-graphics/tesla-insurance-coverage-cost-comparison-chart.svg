<svg xmlns="http://www.w3.org/2000/svg" width="390" height="510" viewBox="0 0 390 510" role="img" aria-labelledby="title desc"><title id="title">Payment fees belong in a like-for-like total</title><desc id="desc">Hypothetical equal $1,000 annual premiums: a no-fee payment plan totals $1,000; a plan adding $8 monthly fees totals $1,096. These are not Tesla or another insurer&#x27;s quoted prices.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="20" y="28" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">Payment fees belong in a</text><text x="20" y="53" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">like-for-like total</text><text x="20" y="85" fill="#26435a" font-size="13" font-weight="400" text-anchor="start">Hypothetical $1,000 premium under two payment</text><text x="20" y="103" fill="#26435a" font-size="13" font-weight="400" text-anchor="start">plans</text><text x="20" y="162" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Plan A: no fees</text><rect x="157" y="143" width="115.333" height="28" rx="3" fill="#61A9BD"><title>Plan A: no fees: $1,000</title></rect><text x="277.3333333333333" y="162" fill="#152f45" font-size="12" font-weight="700" text-anchor="start">$1,000</text><text x="20" y="254" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">Plan B: $8/month</text><text x="20" y="271" fill="#26435a" font-size="12" font-weight="400" text-anchor="start">fees</text><rect x="157" y="235" width="126.405" height="28" rx="3" fill="#61A9BD"><title>Plan B: $8/month fees: $1,096</title></rect><text x="288.4053333333333" y="254" fill="#152f45" font-size="12" font-weight="700" text-anchor="start">$1,096</text><line x1="157" y1="130" x2="157" y2="340" stroke="#8a9dab"/><text x="157" y="365" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">$0 baseline</text><line x1="20" y1="427" x2="370" y2="427" stroke="#d8e3ec"/><text x="20" y="449" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">A: no fees; B: $8 per month in fees. Not a Tesla</text><text x="20" y="465" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">quote.</text></g></svg>