<svg xmlns="http://www.w3.org/2000/svg" width="390" height="510" viewBox="0 0 390 510" role="img" aria-labelledby="title desc"><title id="title">Storage can accumulate before repair starts</title><desc id="desc">Hypothetical storage at $35 per day totals $105 after 3 days, $245 after 7 days and $490 after 14 days. Payment depends on authorization and policy terms.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="20" y="28" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">Storage can accumulate before</text><text x="20" y="53" fill="#152f45" font-size="20" font-weight="700" text-anchor="start">repair starts</text><text x="20" y="85" fill="#26435a" font-size="13" font-weight="400" text-anchor="start">Hypothetical storage cost at $35 per day</text><line x1="53" y1="350.0" x2="370" y2="350.0" stroke="#e2e9ee"/><text x="46" y="354.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$0</text><line x1="53" y1="308.0" x2="370" y2="308.0" stroke="#e2e9ee"/><text x="46" y="312.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$200</text><line x1="53" y1="266.0" x2="370" y2="266.0" stroke="#e2e9ee"/><text x="46" y="270.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$400</text><line x1="53" y1="224.0" x2="370" y2="224.0" stroke="#e2e9ee"/><text x="46" y="228.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$600</text><line x1="53" y1="182.0" x2="370" y2="182.0" stroke="#e2e9ee"/><text x="46" y="186.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$800</text><line x1="53" y1="140.0" x2="370" y2="140.0" stroke="#e2e9ee"/><text x="46" y="144.0" fill="#526c80" font-size="10" font-weight="400" text-anchor="end">$1,000</text><rect x="80.83333333333334" y="327.95" width="50" height="22.05" rx="3" fill="#61A9BD"><title>3 days: $105</title></rect><text x="105.83333333333334" y="318.95" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$105</text><text x="105.83333333333334" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">3 days</text><rect x="186.5" y="298.55" width="50" height="51.45" rx="3" fill="#61A9BD"><title>7 days: $245</title></rect><text x="211.5" y="289.55" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$245</text><text x="211.5" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">7 days</text><rect x="292.1666666666667" y="247.1" width="50" height="102.9" rx="3" fill="#61A9BD"><title>14 days: $490</title></rect><text x="317.1666666666667" y="238.1" fill="#152f45" font-size="12" font-weight="700" text-anchor="middle">$490</text><text x="317.1666666666667" y="373" fill="#26435a" font-size="11" font-weight="400" text-anchor="middle">14 days</text><line x1="20" y1="427" x2="370" y2="427" stroke="#d8e3ec"/><text x="20" y="449" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">3 days: $105; 7 days: $245; 14 days: $490. Not a</text><text x="20" y="465" fill="#26435a" font-size="11" font-weight="400" text-anchor="start">market rate.</text></g></svg>