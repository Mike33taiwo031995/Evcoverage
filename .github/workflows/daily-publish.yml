name: Daily publish

on:
  schedule:
    - cron: '5 23 * * *'
    - cron: '35 23 * * *'
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages rebuild
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
